# https://swagger.io/docs/specification/v3_0/media-types/
paths:
  /employees:
    get:
      summary: Returns a list of employees.
      responses:
        "200": # Response
          description: OK
          content: # Response body
            application/json: # Media type
              schema: # Must-have
                type: object # Data type
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  fullTime:
                    type: boolean
                example: # Sample data
                  id: 1
                  name: Jessica Right
                  fullTime: true
