indentation: 2
function-arrows: leading
record-brace-space: true
haddock-style: single-line
let-style: inline
in-style: right-align
unicode: always
respectful: true
single-constraint-parens: never
single-deriving-parens: never
import-grouping:
  - name: Prelude
    rules:
      - glob: Essentials
  - name: External
    rules:
      - match: all
        priority: 100
  - name: Internal
    rules:
      - glob: Oath.**
